name: Site yoklama

# Streamlit Community Cloud 12 saat kullanılmayan uygulamayı uyutur. Bu iş akışı
# 6 saatte bir siteyi açar (uykudaysa uyandırır) ve main'e her birleşmeden
# sonra yayının açıldığını doğrular; açılmazsa kırmızı olur ve GitHub e-posta
# ile haber verir.
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yokla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Yayının dağıtılmasını bekle
        if: github.event_name == 'push'
        run: sleep 240
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python .github/scripts/site_yokla.py
