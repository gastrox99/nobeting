name: Testler

# main'e her gönderimde tüm testleri gerçek Streamlit ve Chromium ile çalıştırır.
# PR'larda tarayıcı testleri (test_browser_*.py) yalnızca arayüz dosyaları
# değiştiyse çalışır; diğer testler her zaman çalışır.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Aynı PR'a yeni gönderim gelince eski çalışmayı durdurur.
concurrency:
  group: testler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Depoyu yalnızca okur; varsayılan jeton yetkisi gerekmez.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Yedek testleri (test_yedek_db.py, test_browser_yedek.py) için geçici veritabanı.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          # PR'da birleştirme kaydı ve tabanı; değişen dosyaları bulmak için.
          fetch-depth: 2
      - name: Tarayıcı testleri gerekli mi
        id: tarayici
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "gerekli=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          degisen=$(git diff --name-only HEAD^1 HEAD)
          echo "$degisen"
          # Arayüz dosyaları: nobet.py, nobet_*.py (nobet_core.py hariç), tarayıcı testleri,
          # .streamlit/, paketler ve bu iş akışı.
          if echo "$degisen" | grep -v '^nobet_core\.py$' \
             | grep -Eq '^(nobet\.py|nobet_.*\.py|test_browser_.*\.py|\.streamlit/.*|requirements\.txt|\.github/workflows/testler\.yml)$'; then
            echo "gerekli=true" >> "$GITHUB_OUTPUT"
          else
            echo "gerekli=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Tarayıcı testleri atlandı::Arayüz dosyası değişmedi; main'de çalışacak."
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Paketleri kur
        run: pip install -r requirements.txt pytest playwright pyflakes
      - name: Chromium kur
        if: steps.tarayici.outputs.gerekli == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Testleri çalıştır
        shell: bash
        run: |
          set +e
          ek=()
          if [ "${{ steps.tarayici.outputs.gerekli }}" != "true" ]; then
            for f in test_browser_*.py; do ek+=(--ignore="$f"); done
          fi
          python -m pytest -v -p no:cacheprovider --tb=short "${ek[@]}" 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # Hataları GitHub'da "annotation" olarak da göster.
          python - <<'PY'
          import re
          text = open("pytest.log", encoding="utf-8", errors="replace").read()
          blocks = re.split(r"\n_{5,} (.+?) _{5,}\n", text)
          for name, body in list(zip(blocks[1::2], blocks[2::2]))[:20]:
              msg = (name + "\n" + body[-6000:]).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=Test hatası::{msg}")
          PY
          exit $status
