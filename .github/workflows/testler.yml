name: Analiz

on:
  push:
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff
        shell: bash
        run: |
          ruff check --no-cache --select F,E9,B,PLE,PLW,ARG,RUF006,RUF012,RUF013 --ignore B905,B008,PLW0603,PLW2901 --output-format concise . > ruff.txt || true
          wc -l ruff.txt
          python - <<'PY'
          text = open("ruff.txt", encoding="utf-8").read()
          chunks = [text[i:i + 3500] for i in range(0, len(text), 3500)][:12]
          for c in chunks:
              print("::warning title=ruff::" + c.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY

  maymun:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      MONKEY_ROUNDS: "3"
      MONKEY_STEPS: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest playwright
      - run: python -m playwright install --with-deps chromium
      - name: Maymun testi
        shell: bash
        run: |
          python -m pytest test_monkey.py -s -p no:cacheprovider --tb=short > monkey.log 2>&1 || true
          tail -5 monkey.log
          python - <<'PY'
          import os
          text = open("monkey_findings.txt", encoding="utf-8").read() if os.path.exists("monkey_findings.txt") else open("monkey.log", encoding="utf-8").read()[-12000:]
          chunks = [text[i:i + 6000] for i in range(0, len(text), 6000)][:9]
          for c in chunks:
              print("::warning title=maymun::" + c.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
