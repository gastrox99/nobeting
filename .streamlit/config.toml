# Depoya giren tek Streamlit ayarı; şifreler (secrets.toml) depoya girmez.
[server]
# Yüklenen dosya sınırı (MB). Yedek en fazla 20 MB, Excel en fazla 2 MB;
# varsayılan 200 MB büyük dosyaların sunucu belleğini doldurmasına izin veriyordu.
maxUploadSize = 20
# static/ klasörü /app/static/ altında sunulur (Ana Ekran simgesi).
enableStaticServing = true

[runner]
# Yeni dokunuş, önceki çalıştırma bitmeden ikinci bir çalıştırma başlatmasın.
# Açıkken (varsayılan) önceki çalıştırma veritabanına yazarken yenisi aynı eski
# sürümle yazıyor, uygulama kendi kaydını "başka bir yerde değiştirilmiş" sanıp
# kaydı durduruyordu. Kapalıyken yeni dokunuş, önceki kayıt bitince işlenir.
fastReruns = false

# Görünüm: Streamlit'in kırmızı ana rengi sayfadaki "İzin/hata" kırmızısıyla
# karışıyordu. Açık ve koyu tema ayrı tanımlanır; telefon/bilgisayar hangi
# temadaysa uygulama ona uyar.
[theme]
baseRadius = "0.6rem"

[theme.light]
# Beyaz düğme yazısı bu zeminde 5,5:1 (eski #0d9488 3,7:1 idi, güneşte silik).
primaryColor = "#0f766e"

[theme.dark]
primaryColor = "#14b8a6"
