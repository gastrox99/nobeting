# Depoya giren tek Streamlit ayarı; şifreler (secrets.toml) depoya girmez.
[server]
# Yüklenen dosya sınırı (MB). Yedek en fazla 20 MB, Excel en fazla 2 MB;
# varsayılan 200 MB büyük dosyaların sunucu belleğini doldurmasına izin veriyordu.
maxUploadSize = 20
# static/ klasörü /app/static/ altında sunulur (Ana Ekran simgesi).
enableStaticServing = true

# Görünüm: Streamlit'in kırmızı ana rengi sayfadaki "İzin/hata" kırmızısıyla
# karışıyordu. Açık ve koyu tema ayrı tanımlanır; telefon/bilgisayar hangi
# temadaysa uygulama ona uyar.
[theme]
baseRadius = "0.6rem"

[theme.light]
primaryColor = "#0d9488"

[theme.dark]
primaryColor = "#14b8a6"
